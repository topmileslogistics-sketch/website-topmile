name: Unpack project zip

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip found at the repository root — nothing to unpack."
          else
            unzip -o "${zips[0]}"
            rm -f "${zips[0]}"
          fi

      - name: Remove stray files from the repository root
        run: |
          keep=(
            ".env.example"
            ".gitignore"
            "README.md"
            "create-tables.sql"
            "docker-compose.yml"
            "next-env.d.ts"
            "next.config.ts"
            "package-lock.json"
            "package.json"
            "postcss.config.mjs"
            "tsconfig.json"
            "tsconfig.tsbuildinfo"
          )
          while IFS= read -r path; do
            name="${path#./}"
            for k in "${keep[@]}"; do
              if [ "$name" = "$k" ]; then
                continue 2
              fi
            done
            echo "Removing stray: $name"
            rm -f "$name"
          done < <(find . -maxdepth 1 -type f)

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore project files and clear root strays" || echo "Nothing to commit"
          git push
